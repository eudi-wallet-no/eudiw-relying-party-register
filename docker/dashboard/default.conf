server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /status.json {
        alias /tmp/dashboard-status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
}
