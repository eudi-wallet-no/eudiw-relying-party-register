<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tjenestedashboard – Digital lommebok</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="page-header">
        <div>
            <p class="eyebrow">Lokal utvikling</p>
            <h1>Tjenestedashboard</h1>
            <p class="lede">Lenker og helsestatus for tjenestene i Docker Compose.</p>
        </div>
    </header>

    <main>
        <p class="status-help">Status oppdateres hvert femte sekund. IntelliJ-prosesser sjekkes ikke.</p>
        <p id="status-summary" class="status-help" role="status">Henter status …</p>
        <noscript>JavaScript må være aktivert for å vise tjenester og status.</noscript>
        <ul id="service-grid" class="service-grid"></ul>
    </main>

    <script src="/status.js"></script>
</body>
</html>
