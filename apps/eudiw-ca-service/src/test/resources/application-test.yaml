---
spring:
  security:
    api-key: junit-api-key
eudiw-ca:
  root:
    root: true
    lifetime-days: 1825
    crl-distribution-point: "https://junit.idporten.no/v1/certs/root.crl"
    certificate-uri: "https://junit.idporten.no/v1/certs/root.cer"
    keystore:
      type: pkcs12
      location: "base64:"
      password: changeit
      key-alias: junit_root
      key-password: changeit
  intermediates:
    access:
      lifetime-days: 100
      crl-distribution-point: "https://junit.idporten.no/v1/certs/intermediates/access.crl"
      certificate-uri: "https://junit.idporten.no/v1/certs/intermediates/access.cer"
      keystore:
        type: pkcs12
        location: "base64:"
        password: changeit
        key-alias: junit_access_ca
        key-password: changeit
    issuer:
      lifetime-days: 100
      crl-distribution-point: "https://junit.idporten.no/v1/certs/intermediates/issuer.crl"
      certificate-uri: "https://junit.idporten.no/v1/certs/intermediates/issuer.cer"
      keystore:
        type: pkcs12
        location: "base64:"
        password: changeit
        key-alias: junit_issuer_ca
        key-password: changeit
