---
spring:
  config:
    import: file:.env[.properties]
  security:
    api-key: junit-api-key
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    url: "jdbc:h2:mem:ca_junit;MODE=MySQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: junit
    password: junit
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

eudiw-ca:
  intermediates:
    pid_provider:
      certificate-profile:
        qc-statements:
          qc-type: id-etsi-qct-pid