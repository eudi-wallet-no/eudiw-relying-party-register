---
spring:
  security:
    api-key: junit-api-key
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    url: jdbc:h2:mem:ca_junit;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: junit
    password: junit
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
eudiw-ca:
  roots:
    root2:
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: root2
        key-password: changeit
    root3:
      root: root3
      lifetime-days: 1825
      crl-distribution-point: ${eudiw-ca.base-uri}/v1/certs/root3.crl
      certificate-uri: ${eudiw-ca.base-uri}/v1/certs/root3.cer
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: junit_root2
        key-password: changeit
  intermediates:
    access2:
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: access2
        key-password: changeit
    pid_provider2:
      certificate-profile:
        qc-statements:
          qc-type: id-etsi-qct-pid
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: pid_provider2
        key-password: changeit
    eaa_provider2:
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: eaa_provider2
        key-password: changeit
    junit2:
      root: root3
      lifetime-days: 365
      crl-distribution-point: ${eudiw-ca.base-uri}/v1/certs/intermediates/junit2.crl
      certificate-uri: ${eudiw-ca.base-uri}/v1/certs/intermediates/junit2.cer
      keystore:
        type: pkcs12
        location: base64:
        password: changeit
        key-alias: junit_intermediate2
        key-password: changeit
