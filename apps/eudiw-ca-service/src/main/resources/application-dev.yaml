---
server:
  port: 9220

management:
  server:
    port: 9221
  endpoint:
    health:
      show-details: always
spring:
  config:
    import: optional:file:${EUDIW_CA_SERVICE_ENV}[.properties]
  application:
    environment: dev
  datasource:
    url: "jdbc:mariadb://localhost:9226/ca_db"

eudiw-ca:
  base-uri: "http://localhost:9220"
  intermediates:
    access2:
      certificate-profile:
        certificate-policies:
          - "0.4.0.194118.1.2"
        subject-alt-names:
          - "https://eidas2sandkasse.dev"
