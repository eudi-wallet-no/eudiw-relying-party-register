---
server:
  port: 9220

management:
  server:
    port: 9221

spring:
  application:
    environment: dev

eudiw-rp-ca:
  base-uri: "http://eudiw-rp-ca-service:9220"
  root:
    root: true
    lifetime-days: 1000
    crl-distribution-point: ${eudiw-rp-ca.base-uri}/v1/certs/root.crl
    certificate-uri: ${eudiw-rp-ca.base-uri}/v1/certs/root.crt
    keystore:
      type: pkcs12
      location: "base64:"
      password: changeit
      key-alias: eudiw_ca_root
      key-password: changeit
  intermediates:
    access:
      lifetime-days: 500
      crl-distribution-point: ${eudiw-rp-ca.base-uri}/v1/certs/intermediates/access.crl
      certificate-uri: ${eudiw-rp-ca.base-uri}/v1/certs/intermediates/access.crt
      keystore:
        type: pkcs12
        location: "base64:"
        password: changeit
        key-alias: eudiw_ca_intermediate1
        key-password: changeit
