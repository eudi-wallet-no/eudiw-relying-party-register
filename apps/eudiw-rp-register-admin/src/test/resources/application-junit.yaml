spring:
  application:
    name: digital-lommebok-rp-register-admin-selfservice-junit-tests
  thymeleaf:
    enabled: false

TEST_MOCK_WEB_SERVER_PORT: 9252

eudiw-admin-web:
  csp:
    mode: report_only
    policy: >-
      report-uri https://csp-report.digdir.no/api/reports;
      default-src 'none';
      script-src 'self';
      script-src-attr 'none';
      style-src 'self';
      style-src-attr 'none';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self';
      form-action 'self';
      base-uri 'none';
      object-src 'none';
      frame-ancestors 'none'
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://localhost:${TEST_MOCK_WEB_SERVER_PORT}/
  enhetsregisteret-service:
    enhetsregisteret-api-base-uri: http://localhost:${TEST_MOCK_WEB_SERVER_PORT}/


