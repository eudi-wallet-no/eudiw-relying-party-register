---
server:
  port: 9250

management:
  server:
    port: 9250

spring:
  config:
    import: optional:file:${EUDIW_RP_REGISTER_ADMIN_ENV}[.properties]
  application:
    name: digital-lommebok-rp-register-admin
    environment: dev
  thymeleaf:
    cache: false

external-dependency-health-checks:
  health-endpoints:
    eudiw-rp-register-service:
      name: digital-lommebok-rp-register-service
      base-uri: http://localhost:9201

eudiw-admin-web:
  issuer-metadata:
    bevisgenerator: https://utsteder.eidas2sandkasse.dev/.well-known/openid-credential-issuer/bevisgenerator
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://localhost:9200
  security:
    enabled: false
