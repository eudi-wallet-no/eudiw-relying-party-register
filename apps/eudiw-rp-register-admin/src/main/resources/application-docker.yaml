---
spring:
  application:
    environment: docker

external-dependency-health-checks:
  enabled: false

eudiw-admin-web:
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://rp-register-service:9200
      api-key-value: xxx
  security:
    ansattporten:
      allow-synthetic-reportee: true
      request-authorization-details:
        - type: ansattporten:altinn:service
          resource: urn:altinn:resource:5613:1
        - type: ansattporten:altinn:service
          resource: urn:altinn:resource:5621:1
        - type: ansattporten:altinn:service
          resource: urn:altinn:resource:5622:1
        - type: ansattporten:altinn:service
          resource: urn:altinn:resource:6061:1
        - type: ansattporten:altinn:service
          resource: urn:altinn:resource:2480:40
      allow-entra-id: true
      entra-id-request-authorization-details:
        - type: ansattporten:orgno
