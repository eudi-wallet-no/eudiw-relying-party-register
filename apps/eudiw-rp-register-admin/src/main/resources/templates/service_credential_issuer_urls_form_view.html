<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Endre utstedar-URL-ar for tenesta</title>
</head>
<body>
<header th:replace="~{fragments/general :: page_header_fragment}"></header>
<main id="hovudinnhald" tabindex="-1">
    <p class="ds-paragraph">
        <a th:href="${detailsUrl}" class="ds-button" data-variant="secondary">Tilbake til registreringa</a>
    </p>
    <h1 class="ds-heading break-word" data-size="xl">Endre utstedar-URL-ar for tenesta</h1>
    <form th:action="@{|/service/credential-issuer-urls/edit/${registration.id}|}"
          th:object="${credentialIssuerUrlsForm}" method="post" novalidate>
        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
        <section class="ds-card registration-card">
            <div class="ds-card__block">
                <div th:replace="~{fragments/registration_fragments :: card_heading(${registration.tradeName}, null)}"></div>
                <p class="ds-paragraph" id="credential-issuer-url-help">URL-en gjeld alle instansar av tenesta med same rolle.</p>
                <div th:if="${#fields.hasErrors()}" class="ds-alert" data-color="danger"
                     role="alert" tabindex="-1" autofocus aria-labelledby="credential-issuer-url-errors-heading">
                    <h3 id="credential-issuer-url-errors-heading" class="ds-heading" data-size="sm">Rett feila før du lagrar</h3>
                    <ul>
                        <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                        <th:block th:each="entry, iter : *{credentialIssuerUrls}"
                                  th:with="urlField=|credentialIssuerUrls[${iter.index}].credentialIssuerUrl|">
                            <li th:each="error : ${#fields.errors(urlField)}">
                                <a th:href="|#credential-issuer-url-${iter.index}|" th:text="${error}"></a>
                            </li>
                        </th:block>
                    </ul>
                </div>
                <p class="ds-paragraph" th:if="${#lists.isEmpty(credentialIssuerUrls)}">Ingen instansar har roller, og tenesta har ingen lagra utstedar-URL-ar.</p>
                <div class="form-sections">
                    <div th:each="entry, iter : *{credentialIssuerUrls}"
                         th:with="displayName=${entitlementDisplayNames[entry.entitlement] ?: entry.entitlement},
                                  urlField=|credentialIssuerUrls[${iter.index}].credentialIssuerUrl|,
                                  invalid=${#fields.hasErrors(urlField)}">
                        <input type="hidden" th:field="*{credentialIssuerUrls[__${iter.index}__].entitlement}">
                        <input type="hidden" th:field="*{credentialIssuerUrls[__${iter.index}__].originalCredentialIssuerUrl}">
                        <div class="ds-field">
                            <label class="ds-label break-word" th:for="|credential-issuer-url-${iter.index}|"
                                   th:text="|Utstedar-URL for ${displayName}|"></label>
                            <input type="url" class="ds-input" th:name="${urlField}"
                                   th:id="|credential-issuer-url-${iter.index}|"
                                   th:value="${entry.credentialIssuerUrl}"
                                   th:attr="aria-invalid=${invalid},aria-describedby=${invalid ? 'credential-issuer-url-help credential-issuer-url-error-' + iter.index : 'credential-issuer-url-help'}">
                            <p class="ds-validation-message" th:if="${invalid}" th:id="|credential-issuer-url-error-${iter.index}|"
                               th:errors="*{credentialIssuerUrls[__${iter.index}__].credentialIssuerUrl}"></p>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="ds-button" type="submit" th:unless="${#lists.isEmpty(credentialIssuerUrls)}">Lagre</button>
                    <a th:href="${detailsUrl}" class="ds-button" data-variant="secondary">Avbryt</a>
                </div>
            </div>
        </section>
    </form>
</main>
<footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
