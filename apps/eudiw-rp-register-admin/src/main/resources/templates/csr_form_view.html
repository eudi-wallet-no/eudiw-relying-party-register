<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="nb-no">
<head th:replace="~{fragments/general :: head_fragment(title = 'Lag nyt aksesssertifikat')}">

<body th:with="rp=${detailedViewDataAttr}">
<!--/*@thymesVar id="detailedViewDataAttr" type="no.idporten.eudiw.rp.admin.web.resource.RelyingPartyResource"*/-->
    <header th:replace="~{fragments/general :: page_header_fragment}"></header>

    <main>
        <h1 class="ds-heading" data-size="lg">
            Lag nyt aksesssertifikat for <span th:text="${rp.name}"></span>
        </h1>
        <p class="ds-paragraph">
            <a th:href="@{/details#certificates(id=${rp.id})}"
               class="ds-button"
               data-variant="secondary"
               data-size="sm">
                Tilbake til <span th:text="${rp.name}"/>
            </a>
        </p>

        <!--/*@thymesVar id="id" type="java.util.UUID"*/-->
        <form th:replace="~{fragments/csr_fragments :: csr_form_fragment(id=${rp.id})}">
        </form>

    </main>

    <footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
