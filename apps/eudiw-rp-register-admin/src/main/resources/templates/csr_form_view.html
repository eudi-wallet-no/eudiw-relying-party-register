<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <title>Lag nyt aksesssertifikat</title>
</head>

<!--/*@thymesVar id="detailedViewDataAttr" type="no.idporten.eudiw.rp.admin.web.resource.RelyingPartyResource"*/-->
<body th:with="rp=${detailedViewDataAttr}">

    <div th:replace="~{fragments/general :: digdir_header}"></div>
    <p>
        <a th:href="@{/details#certificates(id=${rp.id})}">
            Tilbake til <span th:text="${rp.name}"/>
        </a>
    </p>

    <h2>Registrer CSR for <span th:text="${rp.name}"></span></h2>

    <!--/*@thymesVar id="id" type="java.util.UUID"*/-->
    <form th:replace="~{fragments/csr_fragments :: csr_form_fragment(id=${rp.id})}">
    </form>

    <div th:replace="~{fragments/general :: digdir_footer}"></div>
</body>
</html>
