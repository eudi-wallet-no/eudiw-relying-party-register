<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Endre grunnopplysningar om brukarstaden</title>
</head>
<body>
<header th:replace="~{fragments/general :: page_header_fragment}"></header>
<main id="hovudinnhald" tabindex="-1">
    <p class="ds-paragraph">
        <a th:href="${detailsUrl}" class="ds-button" data-variant="secondary">Tilbake til registreringa</a>
    </p>
    <h1 class="ds-heading break-word" data-size="xl">Endre grunnopplysningar om brukarstaden</h1>
    <form th:action="@{|/relying-party/edit/${registration.id}|}" th:object="${relyingPartyForm}" method="post"
          class="form-container" th:with="editingRelyingParty=true" novalidate>
        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
        <div th:replace="~{fragments/details_tabs_fragments :: relying_party_information_content_fragment(${registration})}"></div>
    </form>
</main>
<footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
