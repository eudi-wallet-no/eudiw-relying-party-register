<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nn">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Endre bevistypar</title>
</head>
<body>
<header th:replace="~{fragments/general :: page_header_fragment}"></header>
<main id="hovudinnhald" tabindex="-1">
    <p class="ds-paragraph">
        <a th:href="${detailsUrl}" class="ds-button" data-variant="secondary">Tilbake til registreringa</a>
    </p>
    <h1 class="ds-heading break-word" data-size="xl">Endre bevistypar</h1>
    <form th:action="@{|/eaas/edit/${registration.id}|}" th:object="${editFormAttr}" method="post"
          class="form-container roles-edit-form" novalidate>
        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
        <section class="ds-card registration-card">
            <div class="ds-card__block">
                <div>
                    <div th:replace="~{fragments/registration_fragments :: card_heading('Bevistypar', null)}"></div>
                    <p class="ds-paragraph">Rediger bevistypar for registreringa.</p>
                </div>
                <div th:if="${#fields.hasErrors()}" class="ds-alert" data-color="danger"
                     role="alert" tabindex="-1" autofocus aria-labelledby="eaas-errors-heading">
                    <h3 id="eaas-errors-heading" class="ds-heading" data-size="sm">Rett feila før du lagrar</h3>
                    <ul>
                        <li th:each="fieldError : ${#fields.detailedErrors()}" th:text="${fieldError.message}"></li>
                    </ul>
                </div>
                <div th:replace="~{fragments/eaa_fragments :: eaa_fields_fragment}"></div>
                <div class="button-group">
                    <button class="ds-button" type="submit">Lagre</button>
                    <a th:href="${detailsUrl}" class="ds-button" data-variant="secondary">Avbryt</a>
                </div>
            </div>
        </section>
    </form>
</main>
<footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
