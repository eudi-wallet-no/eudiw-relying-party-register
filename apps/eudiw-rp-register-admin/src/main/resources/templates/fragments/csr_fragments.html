<!--/*@thymesVar id="csrFormAttr" type="no.idporten.eudiw.rp.admin.web.form.CsrAccessForm"*/-->
<form th:fragment="access_csr_form_fragment(id)"
      th:object="${csrFormAttr}"
      th:action="@{|/csr/access/${id}|}"
      method="POST"
      class="form-container">

    <fieldset class="ds-fieldset">
        <div class="ds-field">
            <label id="csr_form_label"
                   for="csr_form"
                   class="ds-label"
                   data-weight="medium">
                Lim inn gyldig CSR
            </label>
            <textarea id="csr_form"
                      th:field="*{csrField}"
                      th:type="text"
                      class="ds-input csr-textarea"
                      placeholder="PEM-innkoda PKCS10 CSR">
            </textarea>
            <div th:if="${#fields.hasErrors('csrField')}"
                 class="ds-validation-message">
                Lagt inn CSR er ikkje et gyldig CSR.
            </div>
        </div>

    </fieldset>

    <button type="submit"
            class="ds-button">
        Send CSR
    </button>
</form>

<form th:fragment="issuer_csr_form_fragment(id)"
      th:object="${csrFormAttr}"
      th:action="@{|/csr/issuer/${id}|}"
      method="POST"
      class="form-container">
    <!--/*@thymesVar id="csrFormAttr" type="no.idporten.eudiw.rp.admin.web.form.CsrIssuerForm"*/-->
    <!--/*@thymesVar id="rp" type="no.idporten.eudiw.rp.admin.web.resource.RelyingPartyResource"*/-->

    <fieldset
            th:if="${rp.hasIssuerEntitlements()}"
            class="ds-fieldset"
    >
        <legend class="ds-label"
                data-weight="high">
            Vel rolle
        </legend>

        <div th:each="e : ${rp.getIssuerEntitlements()}" class="ds-field">
            <input class="ds-input"
                   type="radio"
                   th:field="*{entitlement}"
                   th:id="|id-${e.entitlement()}|"
                   th:value="${e.entitlement}" />
            <label class="ds-label" th:for="|id-${e.entitlement()}|" th:text="${e.displayName()}"></label>
        </div>
        <div th:if="${#fields.hasErrors('entitlement')}"
             class="ds-validation-message">
            Må velge ein rolle.
        </div>
    </fieldset>

    <fieldset class="ds-fieldset">
        <div class="ds-field">
            <label id="csr_form_label"
                   for="csr_form"
                   class="ds-label"
                   data-weight="medium">
                Lim inn gyldig CSR
            </label>
            <textarea id="csr_form"
                      th:field="*{csrField}"
                      th:type="text"
                      class="ds-input csr-textarea"
                      placeholder="PEM-innkoda PKCS10 CSR">
            </textarea>
            <div th:if="${#fields.hasErrors('csrField')}"
                 class="ds-validation-message">
                Lagt inn CSR er ikkje et gyldig CSR.
            </div>
        </div>

    </fieldset>

    <button type="submit"
            class="ds-button">
        Send CSR
    </button>
</form>

<div th:fragment="single_certificate_table_fragment(cert)"
     class="table-wrap" role="region" aria-label="Access-sertifikat" tabindex="0">
    <!--/*@thymesVar id="cert" type="no.idporten.eudiw.rp.admin.web.search.resultsview.RelyingPartyAccessCertificateSummary"*/-->
    <table class="ds-table">
        <caption class="ds-sr-only">Access-sertifikat</caption>
        <tbody>
        <tr>
            <th scope="row">Serienummer</th>
            <td th:text="${cert.serialNo.toString(16).replaceAll('(?<=..)(..)', ':$1')}"></td>
        </tr>
        <tr>
            <th scope="row">Subjekt</th>
            <td th:text="${cert.subjectDn}"></td>
        </tr>
        <tr>
            <th scope="row">Utstedar</th>
            <td th:text="${cert.issuerDn}"></td>
        </tr>
        <tr>
            <th scope="row">Gyldig frå</th>
            <td th:text="${@timestampFormatter.formatEpochMillis(cert.validFromMs)}"></td>
        </tr>
        <tr>
            <th scope="row">Gyldig til</th>
            <td th:text="${@timestampFormatter.formatEpochMillis(cert.validUntilMs)}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div th:fragment="single_issuer_certificate_table_fragment(cert)"

    <!--/*@thymesVar id="cert" type="no.idporten.eudiw.rp.admin.web.search.resultsview.RelyingPartyCertificateSummary"*/-->
    <table class="ds-table">
        <caption class="ds-sr-only">Issuer-sertifikat</caption>
        <tbody>
        <tr>
            <th scope="row">Rolle</th>
            <td th:text="${cert.entitlement}"></td>
        </tr>
        <tr>
            <th scope="row">Serienummer</th>
            <td th:text="${cert.serialNo.toString(16).replaceAll('(?<=..)(..)', ':$1')}"></td>
        </tr>
        <tr>
            <th scope="row">Subjekt</th>
            <td th:text="${cert.subjectDn}"></td>
        </tr>
        <tr>
            <th scope="row">Utstedar</th>
            <td th:text="${cert.issuerDn}"></td>
        </tr>
        <tr>
            <th scope="row">Gyldig frå</th>
            <td th:text="${@timestampFormatter.formatEpochMillis(cert.validFromMs)}"></td>
        </tr>
        <tr>
            <th scope="row">Gyldig til</th>
            <td th:text="${@timestampFormatter.formatEpochMillis(cert.validUntilMs)}"></td>
        </tr>
        </tbody>
    </table>
</div>
