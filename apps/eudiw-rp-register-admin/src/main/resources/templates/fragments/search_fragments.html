<!--/*@thymesVar id="searchFormAttr" type="no.idporten.eudiw.rp.admin.web.resource.SearchForm"*/-->
<form th:fragment="search_form_fragment"
      th:object="${searchFormAttr}"
      th:action="@{/search}"
      method="POST">
        <div class="ds-search"
             style="margin-block-end: var(--ds-size-2)">
            <input id="search_term"
                   th:field="*{searchTerm}"
                   placeholder="Søk på org.nr. eller navn"
                   size="50"
                   type="text"
                   class="ds-input">
            <button type="reset"
                    class="ds-button"
                    data-icon="true"
                    data-variant="tertiary"
            ></button>
            <button type="submit"
                    class="ds-button"
                    data-variant="primary">Søk</button>
        </div>

        <label for="includeInactive">Inkluder inaktive</label>

        <input id="includeInactive"
               type="checkbox"
               th:field="*{includeInactive}"
               class="ds-input">

    <ul th:if="${#fields.hasErrors()}">
        <li th:each="error : ${#fields.errors('searchTerm')}"
            th:text="${error}"
            class="ds-validation-message"></li>
    </ul>
</form>

<div th:fragment="results_table_fragment"
     th:if="${@relyingPartiesView.hasResults()}">

    <!--/*@thymesVar id="full_results" type="no.idporten.eudiw.rp.admin.web.search.resultsview.RelyingPartiesView"*/-->
    <!--/*@thymesVar id="sorted_and_filtered_results" type="java.util.List<no.idporten.eudiw.rp.admin.web.resource.RelyingPartyResource>"*/-->
    <div th:with="resultsPage=${@relyingPartiesView.getCurrentResultsPage()}">
        <div th:if="${#lists.isEmpty(resultsPage)}">
            Fant ingen brukersteder. Ta bort et eller flere filtre, eller prøv en ny søking.
        </div>

        <table th:unless="${#lists.isEmpty(resultsPage)}"
               class="ds-table" data-border="true">
            <thead>
            <tr>
                <th>
                    <label>Org.nr.</label>
                </th>
                <th>
                    <label>Navn</label>
                </th>
                <th>
                    <label>Oppretta</label>
                </th>
                <th>
                    <label>Sist oppdatert</label>
                </th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="rp : ${resultsPage}">
                <td><a th:href="@{/details(id=${rp.id})}" style="cursor:pointer;"><div th:text="${rp.orgno}"></div></a> </td>
                <td th:text="${rp.name}"></td>
                <td th:text="${#dates.format(rp.createdMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
                <td th:text="${#dates.format(rp.lastUpdatedMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:with="pageWindow=${@relyingPartiesView.getPaginationWindow()},
                  currentPageNum=${@relyingPartiesView.getCurrentPageIdx() + 1},
                  numPages=${@relyingPartiesView.getNumPages()}"
         class="ds-pagination"
    >

        <ul th:if="${numPages > 1}">
            <th:block th:unless="${#lists.contains(pageWindow, 1)}">
                <li>
                    <a th:href="@{search(page=1)}"
                       class="ds-button"
                       data-variant="tertiary">
                        <<
                    </a>
                </li>
            </th:block>

            <li th:each="pageNum : ${pageWindow}">

                <a th:if="${pageNum == currentPageNum}"
                   th:href="@{search(page=${pageNum})}"
                   class="ds-button"
                   data-variant="primary">
                    <span th:text="${pageNum}"></span>
                </a>
                <a th:unless="${pageNum == currentPageNum}"
                   th:href="@{search(page=${pageNum})}"
                   class="ds-button"
                   data-variant="tertiary">
                    <span th:text="${pageNum}"></span>
                </a>
            </li>

            <th:block th:unless="${#lists.contains(pageWindow, numPages)}">
                <li>
                    <a th:href="@{search(page=${numPages})}"
                       class="ds-button"
                       data-variant="tertiary">
                        >>
                    </a>
                </li>
            </th:block>
        </ul>
    </nav>
</div>
