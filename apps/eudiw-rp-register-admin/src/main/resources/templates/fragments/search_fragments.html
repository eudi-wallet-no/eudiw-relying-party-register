<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <title>Search page fragments</title>
</head>
<body>

<div th:fragment="search_form">
    <form th:object="${searchFormAttr}"
          th:action="@{/search}"
          method="GET"
    >
        <div class="search-form-row">
            <label for="search_term"></label>
            <input th:class="ds-input" id="search_term" type="text" size="60"
                   th:field="*{searchTerm}"
                   placeholder="Søk på org.nr. eller navn">

            <label for="includeInactive">Inkluder inaktive</label>
            <input id="includeInactive" type="checkbox" th:field="*{includeInactive}">

            <button type="submit">Søk</button>
        </div>

        <ul th:if="${#fields.hasErrors()}">
            <li th:each="error : ${#fields.errors('searchTerm')}"
                th:text="${error}"/>
        </ul>
    </form>
</div>


<div th:fragment="build_results_table(results)">
    <h2>Søkeresultat</h2>
    <div class="fixed-headers-table"
         th:with="resultsView=${results.applyViewSpec()}"
    >
        <table>
            <thead>
            <tr>
                <th>
                    <label>Org.nr.</label>
                </th>
                <th>
                    <label>Navn</label>
                </th>
                <th>
                    <label>Oppretta</label>
                </th>
                <th>
                    <label>Sist oppdatert</label>
                </th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(resultsView)}">
                <td th:colspan="4">
                    Fant ingen brukerstader!
                </td>
            </tr>
            <tr th:each="rp : ${resultsView}">
                <td><a th:href="|@{/details}?id=${rp.id}|" style="cursor:pointer;"><div th:text="${rp.orgno}"/></a> </td>
                <td th:text="${rp.name}"/>
                <td th:text="${#dates.format(rp.createdMs, 'dd-MM-yyyy HH:mm:ss')}"/>
                <td th:text="${#dates.format(rp.lastUpdatedMs, 'dd-MM-yyyy HH:mm:ss')}"/>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
