<!--/*@thymesVar id="search_form" type="no.idporten.eudiw.rp.admin.web.resource.SearchForm"*/-->
<!--/*@thymesVar id="searchFormAttr" type="no.idporten.eudiw.rp.admin.web.resource.SearchForm"*/-->
<div th:fragment="search_form_fragment(searchFormAttr)">
    <form th:object="${searchFormAttr}"
          th:action="@{/search}"
          method="GET"
    >
        <div class="search-form-row">
            <label for="search_term"></label>
            <input th:class="ds-input" id="search_term" type="text" size="60"
                   th:field="*{searchTerm}"
                   placeholder="Søk på org.nr. eller navn">

            <label for="includeInactive">Inkluder inaktive</label>
            <input id="includeInactive" type="checkbox" th:field="*{includeInactive}">

            <button type="submit">Søk</button>
        </div>

        <ul th:if="${#fields.hasErrors()}">
            <li th:each="error : ${#fields.errors('searchTerm')}"
                th:text="${error}">
            </li>
        </ul>
    </form>
</div>


<!--/*@thymesVar id="full_results" type="no.idporten.eudiw.rp.admin.web.search.resultsview.RelyingPartiesView"*/-->
<div th:fragment="results_table_fragment(full_results)"
     th:if="${full_results} != null">
    <h2>Søkeresultat</h2>
    <div th:with="sorted_and_filtered_results=${full_results.applyViewSpec()}">
        <!--/*@thymesVar id="sorted_and_filtered_results" type="java.util.List<no.idporten.eudiw.rp.admin.web.resource.RelyingPartyResource>"*/-->
        <table>
            <thead>
            <tr>
                <th>
                    <label>Org.nr.</label>
                </th>
                <th>
                    <label>Navn</label>
                </th>
                <th>
                    <label>Oppretta</label>
                </th>
                <th>
                    <label>Sist oppdatert</label>
                </th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(sorted_and_filtered_results)}">
                <td th:colspan="4">
                    Fant ingen brukerstader!
                </td>
            </tr>
            <tr th:each="rp : ${sorted_and_filtered_results}">
                <td><a th:href="|@{/details}?id=${rp.id}|" style="cursor:pointer;"><div th:text="${rp.orgno}"></div></a> </td>
                <td th:text="${rp.name}"></td>
                <td th:text="${#dates.format(rp.createdMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
                <td th:text="${#dates.format(rp.lastUpdatedMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
