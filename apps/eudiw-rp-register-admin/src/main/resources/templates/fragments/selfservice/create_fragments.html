<form th:fragment="create_form_fragment"
      id="create_form"
      th:object="${createFormAttr}"
      th:action="@{/create}"
      method="POST"
      th:with="reportee=${reporteeAttr}">
    <!--/*@thymesVar id="reporteeAttr" type="no.idporten.eudiw.rp.admin.web.security.oidcusers.SelfServiceReportee"*/-->
    <!--/*@thymesVar id="createFormAttr" type="no.idporten.eudiw.rp.admin.web.form.CreateRelyingPartyForm"*/-->

    <div style="margin-bottom: 8px;">
    <div class="ds-card">
        <fieldset class="ds-fieldset"
                  data-size="sm">
            <legend class="ds-label"
                    data-weight="high">
                Generelt
            </legend>

            <p class="ds-paragraph">
                <label for="orgno_field"
                       data-weight="medium"
                       class="ds-label">
                    Org.nr.
                </label>
                <input id="orgno_field"
                       type="text"
                       class="ds-input"
                       th:value="${reportee.orgno()}"
                       disabled>
            </p>

            <p class="ds-paragraph">
                <label for="name_field"
                       class="ds-label">
                    Namn
                </label>
                <input id="name_field"
                       type="text"
                       class="ds-input"
                       th:value="${reportee.name()}"
                       disabled>
            </p>

            <p class="ds-paragraph">
                <label for="sector_field"
                       class="data-label">
                    Sektor
                </label>
                <select id="sector_field"
                        class="ds-input"
                        disabled>
                    <option th:text="${reportee.publicSector()} ? 'Offentleg' : 'Privat'"></option>
                </select>
            </p>
        </fieldset>
    </div>

    <div class="ds-card">
        <fieldset class="ds-fieldset" data-size="sm">
            <legend class="ds-label"
                    data-weight="high">
                Vel roller
            </legend>

            <div class="ds-field">
                <label for="service_provider_entitlement">
                       https://uri.etsi.org/19475/Entitlement/Service_Provider
                </label>
                <input id="service_provider_entitlement"
                       type="checkbox"
                       class="ds-input"
                       checked="checked"
                       disabled>
            </div>
        </fieldset>

    </div>

    <div class="ds-card">
        <fieldset class="ds-fieldset" data-size="sm">
            <legend class="ds-label"
                    data-weight="high">
                Vel bevistypar
            </legend>

            <div class="flex-container">
                <div>
                    <p class="ds-paragraph"
                       style="margin-bottom: 8px;">
                        Bevistypar lagt inn
                    </p>
                    <table class="ds-table"
                           data-border="true"
                           style="table-layout: fixed; word-wrap: break-word;">
                        <thead>
                        <tr>
                            <th>Bevistype</th>
                            <th>Føremål</th>
                            <th style="width: 4em;"></th>
                        </tr>
                        </thead>
                        <tbody id="eaa_container"></tbody>
                    </table>
                </div>

                <div>
                    <fieldset class="ds-fieldset">
                        <legend class="ds-legend">
                            Legg til ny bevistype
                        </legend>
                        <div style="margin-bottom: 8px;">
                            <label for="eaa_namespace_field"
                                   class="ds-label">
                                Bevistype
                            </label>
                            <input id="eaa_namespace_field"
                                   type="text"
                                   placeholder="Bevistype ..."
                                   class="ds-input">
                            <div id="eaa_namespace_error_msg"
                                 th:insert="~{fragments/general ::
                                                    generic_invalid_input_field_error_msg('EAA-namespace')}"
                                 style="display: none;"></div>

                            <label for="eaa_intent_field"
                                   class="ds-label">
                                Føremål
                            </label>
                            <input id="eaa_intent_field"
                                   type="text"
                                   placeholder="Føremål ..."
                                   class="ds-input">
                            <div id="eaa_intent_error_msg"
                                 th:insert="~{fragments/general ::
                                                    generic_invalid_input_field_error_msg('EAA-intent')}"
                                 style="display: none;"></div>
                        </div>
                        <button type="button"
                                onclick="addEaaOnclick()"
                                class="ds-button"
                                data-variant="secondary">
                            Legg til
                        </button>
                    </fieldset>
                </div>

            </div>
        </fieldset>
    </div>
    </div>

    <div class="flex-container">
        <button type="submit"
                class="ds-button"
                data-variant="primary">
            Registrer brukarstad
        </button>

        <a th:href="@{/search}"
           class="ds-button"
           type="button"
           data-variant="secondary"
           data-color="danger"
           style="display: flex;">
            Avbryt
        </a>
    </div>

<script src="/js/dynamic_edit_form_fields.js"></script>

<!--/* pre-fill EAA list with values from the create form. this can be non-empty
       if e.g. the page is reloaded after a form validation error. */-->
<th:block th:each="eaa : ${createFormAttr.getEaas()}">
    <script>addEaa("[[${eaa.namespace}]]", "[[${eaa.intent}]]");</script>
</th:block>
</form>
