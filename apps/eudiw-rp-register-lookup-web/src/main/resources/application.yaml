---
server:
  port: 8080

  servlet:
    session:
      tracking-modes: cookie

spring:
  thread-executor: virtual
  application:
    name: eudiw-rp-register-lookup-web
    environment: default


# Spring Boot Actuator
management:
  server:
    port: 8090
  endpoints:
    web:
      base-path: /
      exposure:
        include: info,version,prometheus,health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      status:
        order: DOWN, OUT_OF_SERVICE, UNKNOWN, DEGRADED, EXTERNAL_DEPENDENCY_DOWN, UP
  health:
    group:
      readiness:
        include: db
      liveness:
        include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

eudiw-rp-register-lookup-web:
  service:
    api-search-endpoint: /search
    rest-client-defaults:
      register-service-api-base-uri: ${API_BASE_URI}
      api-key-header-id: X-API-KEY
      api-key-value: ${API_KEY_VALUE}
      connect-timeout-millis: 5000
      read-timeout-millis: 5000

external-dependency-health-checks:
  health-endpoints:
    eudiw-rp-service:
      name: eudiw-rp-service
      base-uri: http://eudiw-rp-service-service:8090
      endpoint: /health
      connect-timeout-ms: 2000
      read-timeout-ms: 1000
      map-down-status-to: DOWN
