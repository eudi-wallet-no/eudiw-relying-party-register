---
spring:
  config:
    import: optional:file:${EUDIW_RP_REGISTER_LOOKUP_WEB_SYSTEST_ENV}[.properties]
  thymeleaf:
    cache: false

eudiw-rp-register-lookup-web:
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://digital-lommebok-rp-register-service-service:8080
  credentials-service:
    credentials-registry-api:
      credentials-registry-base-uri: http://digital-lommebok-credential-registry-service:8080

external-dependency-health-checks:
  health-endpoints:
    eudiw-rp-service:
      base-uri: http://digital-lommebok-rp-register-service-service-actuator:8090

