<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <link rel="stylesheet" th:href="@{/css/simple_tabs.css}">
    <link rel="stylesheet" th:href="@{/css/clickable_headers.css}">
    <title>Register over brukerstader</title>
</head>

<body data-color-scheme="light" data-size="md">
    <header th:replace="~{fragments/general :: page_header_fragment}"></header>

    <main id="hovudinnhald" tabindex="-1">
        <nav id="tabs_container" aria-label="Katalognavigasjon">
            <a th:href="@{/relying-parties}" class="tab" data-size="md" aria-selected="true">
                Brukarstader
            </a>
            <a th:href="@{/credentials-catalogue}" class="tab" data-size="md">
                Beviskatalog
            </a>
        </nav>

        <div style="display:flex; flex-direction:column; gap:var(--ds-size-2); max-width:720px;">
            <h1 class="ds-heading" data-size="xl">
                Register over brukarstader
            </h1>
            <p class="ds-paragraph" data-size="lg" style="color:var(--ds-color-neutral-text-subtle);">Søk på organisasjonsnummer eller namn, og filtrer på rolle.</p>
        </div>
        <form th:replace="~{fragments/search_fragments :: search_form_fragment}">
        </form>

        <div th:replace="~{fragments/search_fragments :: results_table_fragment(credentialsByType=${credentialsByTypeAttr})}">
        </div>
    </main>

    <footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
