<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Relying Parties List</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch(document.getElementById("lookupUrl").value)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById("relyingPartiesList");
                    data.forEach(item => {
                        const li = document.createElement("li");
                        li.textContent = `ID: ${item.id}, Name: ${item.name}, Description: ${item.description}`;
                        list.appendChild(li);
                    });
                });
        });
    </script>
</head>
<body>
<h1>Relying Parties Lookup</h1>
<ul id="relyingPartiesList"></ul>
<input type="hidden" id="lookupUrl" th:value="'/v1/rp/lookup'" />
</body>
</html>
