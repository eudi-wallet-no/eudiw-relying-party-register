<div th:fragment="credentials_table_fragment">
    <!--/*@thymesVar id="credentialsAttr" type="java.util.List<no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource>"*/-->
    <div th:with="credentials=${credentialsAttr}">
        <div th:if="${#lists.isEmpty(credentials)}">
            Fann ingen bevistypar.
        </div>

        <table th:unless="${#lists.isEmpty(credentials)}"
               class="ds-table"
               data-border="true">
            <thead class="clickableHeaders">
                <tr>
                    <th>Namn</th>
                    <th>Utstedar</th>
                    <th>Antall attributt</th>
                    <th>Format</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="credential : ${credentials}">
                    <td>
                        <a th:href="@{/credential/{issuer}/{config-id}
                                        (issuer=${#uris.escapePathSegment(credential.issuer())},
                                         config-id=${#uris.escapePathSegment(credential.configurationId())})}"
                           class="ds-link"
                           data-variant="secondary"
                           th:text="${credential.metadata().getCredentialTypeDisplay('no')}">
                        </a>
                    </td>
                    <td th:text="${credential.getIssuerDisplay('no')}"></td>
                    <td th:text="${credential.metadata().claims().size()}"></td>
                    <td th:text="${credential.format()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:fragment="single_credential_table_fragment(credential)">
    <!--/*@thymesVar id="credential" type="no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource"*/-->
    <div style="padding-bottom: 2em;">
        <table class="ds-table">
            <tbody>
                <tr>
                    <th>Namn</th>
                    <td th:text="${credential.metadata().getCredentialTypeDisplay('no')}"></td>
                </tr>
                <tr>
                    <th>Bevistype</th>
                    <td th:text="${credential.credentialType()}"></td>
                </tr>
                <tr>
                    <th>Utstedar</th>
                    <td>
                        <span th:text="${credential.getIssuerDisplay('no')}"></span>
                        (<a th:href="|${credential.issuer()}/.well-known/openid-credential-issuer|"
                            th:text="${credential.issuer()}"
                            class="ds-link"
                            style="display: inline;">
                        </a>)
                    </td>
                </tr>
                <tr>
                    <th>Antall attributt</th>
                    <td th:text="${credential.metadata().claims().size()}"></td>
                </tr>
                <tr>
                    <th>Format</th>
                    <td th:text="${credential.format()}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <details class="ds-details">
        <summary class="ds-label">Bevis-attributt</summary>
        <p th:if="${#lists.isEmpty(credential.metadata().claims())}"
           class="ds-paragraph">
            Beviset har ingen attributt.
        </p>
        <table th:if="${! #lists.isEmpty(credential.metadata().claims())}"
                class="ds-table">
            <thead>
                <tr>
                    <th>Attributt</th>
                    <th>DCQL-path</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="claim : ${credential.metadata().claims()}">
                    <td th:text="${claim.getClaimsDisplay('no')}"></td>
                    <td th:text="${claim.getDcqlFormattedPaths()}"></td>
                </tr>
            </tbody>
        </table>
    </details>
</div>
