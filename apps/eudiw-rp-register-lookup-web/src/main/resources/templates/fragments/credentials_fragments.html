<div th:fragment="credentials_table_fragment">
    <!--/*@thymesVar id="credentialsAttr" type="java.util.List<no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource>"*/-->
    <div th:with="credentials=${credentialsAttr}">
        <div th:if="${#lists.isEmpty(credentials)}">
            Fann ingen bevistypar.
        </div>

        <table th:unless="${#lists.isEmpty(credentials)}"
               class="ds-table"
               data-border="true">
            <thead class="clickableHeaders">
                <tr>
                    <th>Bevis</th>
                    <th>Utstedar</th>
                    <th>Antall attributter</th>
                    <th>Format</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="credential : ${credentials}">
                    <td th:text="${credential.credentialType()}"></td>
                    <td th:text="${credential.issuer()}"></td>
                    <td th:text="${credential.metadata().size()}"></td>
                    <td th:text="${credential.format()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
