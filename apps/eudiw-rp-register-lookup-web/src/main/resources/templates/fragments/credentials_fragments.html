<div th:fragment="credentials_table_fragment">
    <!--/*@thymesVar id="credentialsAttr" type="java.util.List<no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource>"*/-->
    <div th:with="credentials=${credentialsAttr}">
        <div th:if="${#lists.isEmpty(credentials)}"
             class="ds-alert"
             data-color="info"
             role="status">
            <p class="ds-paragraph">Fann ingen bevistypar.</p>
        </div>

        <div th:unless="${#lists.isEmpty(credentials)}"
              style="display:flex; flex-direction:column; gap:var(--ds-size-6);">
            <form th:action="@{/credentials-catalogue}" method="GET" class="ds-field" style="max-width:32rem;">
                <label for="credentials_filter_field" class="ds-label">Filtrer beviser</label>
                <div style="display:flex; align-items:center; gap:var(--ds-size-3);">
                    <div class="ds-search" style="flex:1;">
                        <input id="credentials_filter_field"
                               name="searchTerm"
                               th:value="${searchTermAttr}"
                               class="ds-input"
                               type="search"
                               placeholder="Filtrer beviser"
                               aria-label="Filtrer beviser">
                        <button type="reset"
                                class="ds-button"
                                data-icon="true"
                                data-variant="tertiary"
                                aria-label="Fjern tekst"></button>
                    </div>
                    <button type="submit" class="ds-button" data-variant="primary">Søk</button>
                </div>
                <p class="ds-paragraph" data-size="sm" data-field="description">Søket filtrerer i tabellen under.</p>
            </form>

            <div class="table-wrapper">
                <table id="credentials_table"
                       class="ds-table"
                       data-border="true"
                       data-hover="true"
                       style="width:100%;">
                    <thead class="clickableHeaders">
                        <tr>
                            <!--/*@thymesVar id="sortKeyAttr" type="java.lang.String"*/-->
                            <th th:class="${#strings.equals(sortKeyAttr, 'name') ? 'focused' : ''}"
                                th:attr="aria-sort=${#strings.equals(sortKeyAttr, 'name') ? 'ascending' : 'none'}">
                                <a th:href="@{/credentials-catalogue(searchTerm=${searchTermAttr}, sort='name')}" class="ds-link">
                                    Namn
                                </a>
                            </th>
                            <th th:class="${#strings.equals(sortKeyAttr, 'issuer') ? 'focused' : ''}"
                                th:attr="aria-sort=${#strings.equals(sortKeyAttr, 'issuer') ? 'ascending' : 'none'}">
                                <a th:href="@{/credentials-catalogue(searchTerm=${searchTermAttr}, sort='issuer')}" class="ds-link">
                                    Utstedar
                                </a>
                            </th>
                            <th th:class="${#strings.equals(sortKeyAttr, 'credential_type') ? 'focused' : ''}"
                                th:attr="aria-sort=${#strings.equals(sortKeyAttr, 'credential_type') ? 'ascending' : 'none'}">
                                <a th:href="@{/credentials-catalogue(searchTerm=${searchTermAttr}, sort='credential_type')}" class="ds-link">
                                    Bevistype
                                </a>
                            </th>
                            <th th:class="${#strings.equals(sortKeyAttr, 'format') ? 'focused' : ''}"
                                th:attr="aria-sort=${#strings.equals(sortKeyAttr, 'format') ? 'ascending' : 'none'}">
                                <a th:href="@{/credentials-catalogue(searchTerm=${searchTermAttr}, sort='format')}" class="ds-link">
                                    Format
                                </a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="credential : ${credentials}"
                            th:attr="data-clickdelegatefor=${'cred-' + credential.getConfigurationId()}">
                            <td>
                                <a th:id="${'cred-' + credential.getConfigurationId()}"
                                   th:href="@{/credential
                                                (issuer=${credential.getIssuer()},
                                                 config-id=${credential.getConfigurationId()})}"
                                   class="ds-link"
                                   th:text="${credential.getCredentialTypeDisplayName('no')}"
                                   th:title="${credential.getCredentialTypeDescription('no')}"
                                   style="font-weight:var(--ds-font-weight-medium);">
                                </a>
                            </td>
                            <td th:text="${credential.getIssuerDisplayName('no')}"></td>
                            <td th:text="${#strings.abbreviate(credential.getCredentialType(),40)}"></td>
                            <td th:text="${credential.getFormat()}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:fragment="single_credential_table_fragment(credential)">
    <!--/*@thymesVar id="credential" type="no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource"*/-->
    <div style="max-width:720px;">
    <div style="margin-block-end: var(--ds-size-8);">
        <div class="table-wrapper">
            <table class="ds-table" data-border="true" style="width:100%;">
                <tbody>
                    <tr>
                        <th scope="row">Namn</th>
                        <td th:text="${credential.getCredentialTypeDisplayName('no')}"></td>
                    </tr>
                    <tr th:if="${! #strings.isEmpty(credential.getCredentialTypeDescription('no'))}">
                        <th scope="row">Skildring</th>
                        <td th:text="${credential.getCredentialTypeDescription('no')}"></td>
                    </tr>
                    <tr th:if="${credential.getCredentialType()}">
                        <th scope="row">Bevistype</th>
                        <td th:text="${credential.getCredentialType()}"></td>
                    </tr>
                    <tr>
                        <th scope="row">Utstedar</th>
                        <td>
                            <span th:text="${credential.getIssuerDisplayName('no')}"></span>
                            (<a th:href="|${credential.getIssuer()}/.well-known/openid-credential-issuer|"
                                 th:text="${credential.getIssuer()}"
                                 class="ds-link">
                            </a>)
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">Antal attributt</th>
                        <td th:if="${credential.getMetadata()==null or credential.getMetadata().getClaims()==null or credential.getMetadata().getClaims().isEmpty()}">Beviset har ingen attributt.</td>
                        <td th:if="${credential.getMetadata()!=null and credential.getMetadata().getClaims()!=null and !credential.getMetadata().getClaims().isEmpty()}" th:text="${credential.getMetadata().getClaims().size()}"></td>
                    </tr>
                    <tr>
                        <th scope="row">Format</th>
                        <td th:text="${credential.getFormat()}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <details class="ds-details" data-variant="default">
        <summary th:text="${credential.getMetadata()!=null and credential.getMetadata().getClaims()!=null ? ('Bevis-attributt (' + credential.getMetadata().getClaims().size() + ')') : 'Bevis-attributt'}">Bevis-attributt</summary>
        <div style="display:flex; flex-direction:column; gap:var(--ds-size-4);">
            <p th:if="${credential.getMetadata()==null or credential.getMetadata().getClaims()==null or credential.getMetadata().getClaims().isEmpty()}"
               class="ds-paragraph">
                Beviset har ingen attributt.
            </p>
            <div th:if="${credential.getMetadata()!=null and credential.getMetadata().getClaims()!=null and !credential.getMetadata().getClaims().isEmpty()}"
                 class="table-wrapper">
                <table class="ds-table" data-border="true" style="width:100%;">
                    <thead>
                        <tr>
                            <th>Attributt</th>
                            <th>DCQL-path</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="claim : ${credential.getMetadata().getClaims()}">
                            <td th:text="${claim.getClaimsDisplayName('no')}"></td>
                            <td th:text="${claim.getDcqlFormattedPaths()}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </details>
    </div>
</div>
