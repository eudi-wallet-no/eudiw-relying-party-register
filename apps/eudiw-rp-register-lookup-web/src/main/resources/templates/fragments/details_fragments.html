<div th:fragment="general_info_content_fragment(rp, credentialsByType)">
    <!--/*@thymesVar id="rp" type="no.idporten.eudiw.rp.register.lookup.web.resource.RelyingPartyResource"*/-->
    <!--/*@thymesVar id="credentialsByType" type="java.util.Map<String, no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource>"*/-->
    <div style="margin-block-end: var(--ds-size-8);">
        <div class="table-wrapper">
            <table class="ds-table" data-border="true" style="width:100%;">
                <tbody>
                <tr>
                    <th scope="row">Org.nr.</th>
                    <td th:text="${rp.orgno}"></td>
                </tr>
                <tr>
                    <th scope="row">Organisasjon</th>
                    <td th:text="${rp.orgName}"></td>
                </tr>
                <tr>
                    <th scope="row">Namn</th>
                    <td th:text="${rp.tradeName}"></td>
                </tr>
                <tr>
                    <th scope="row">Sektor</th>
                    <td th:text="${rp.publicSector ? 'offentleg' : 'privat'}"></td>
                </tr>
                <tr>
                    <th scope="row">Oppretta</th>
                    <td th:text="${@timestampFormatter.formatEpochMillis(rp.createdMs)}"></td>
                </tr>
                <tr>
                    <th scope="row">Sist endra</th>
                    <td th:text="${@timestampFormatter.formatEpochMillis(rp.lastUpdatedMs)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:var(--ds-size-6);">
        <h2 class="ds-heading" data-size="md">Roller og bevistypar</h2>

        <details class="ds-details" data-variant="default">
            <summary th:text="|Roller (${#lists.size(rp.relyingPartyEntitlements)})|">Roller</summary>
            <div style="display:flex; flex-direction:column; gap:var(--ds-size-4);">
                <p th:if="${ #lists.isEmpty(rp.relyingPartyEntitlements)}" class="ds-paragraph">
                    <em>Ingen registrert.</em>
                </p>
                <div th:unless="${ #lists.isEmpty(rp.relyingPartyEntitlements)}"
                     style="display:flex; flex-wrap:wrap; gap:var(--ds-size-3);">
                    <span th:each="e : ${rp.relyingPartyEntitlements}"
                          class="ds-tag"
                          th:text="${e.displayName}"></span>
                </div>
            </div>
        </details>

        <details class="ds-details">
            <summary th:text="|Bevistypar (EAA) (${#lists.size(rp.relyingPartyEaas)})|">Bevistypar (EAA)</summary>
            <div style="display:flex; flex-direction:column; gap:var(--ds-size-4);">
                <p th:if="${ #lists.isEmpty(rp.relyingPartyEaas)}" class="ds-paragraph">
                    <em>Ingen registrert.</em>
                </p>
                <div th:unless="${ #lists.isEmpty(rp.relyingPartyEaas)}" class="table-wrapper">
                    <table class="ds-table" data-border="true" style="width:100%;">
                        <thead>
                            <tr>
                                <th>Bevistype</th>
                                <th>Føremål</th>
                            </tr>
                        </thead>
                        <tbody>
                        <tr th:each="eaa : ${rp.relyingPartyEaas}"
                            th:with="credential=${credentialsByType.get(eaa.namespace)}">
                            <td>
                                <a th:if="${credential != null}"
                                   th:href="@{/credential
                                                (issuer=${credential.getIssuer()},
                                                 config-id=${credential.getConfigurationId()})}"
                                   class="ds-link"
                                   th:text="${credential.getCredentialTypeDisplayName('no')}"
                                   th:title="${credential.getCredentialTypeDescription('no')}"
                                   style="font-weight:var(--ds-font-weight-medium);">
                                </a>
                                <span th:unless="${credential != null}" th:text="${eaa.namespace}"></span>
                                <span th:if="${credential != null}"
                                      class="ds-paragraph"
                                      data-size="sm"
                                      style="display:block; color:var(--ds-color-neutral-text-subtle);"
                                      th:text="${eaa.namespace}"></span>
                            </td>
                            <td th:text="${eaa.intent}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </details>
    </div>
</div>
