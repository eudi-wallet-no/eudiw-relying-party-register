<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <title>Fragments</title>
</head>
<body>


<div th:fragment="detailed_view_column"
     class="details-column"
     th:if="${#ctx.containsVariable('detailedViewDataAttr')}"
     th:with="rp=${detailedViewDataAttr}">

    <h2>Detaljer for <span th:text="${rp.name}"></span></h2>
    <div class="vertical-headers-table">
        <table th:class="ds-table" data-zebra="true" data-hover="true">
            <tbody>
            <tr>
                <th>Org.nr.</th>
                <td th:class="ds-label" th:text="${rp.orgno}"></td>
            </tr>
            <tr>
                <th>Navn</th>
                <td th:class="ds-label" th:text="${rp.name}"></td>
            </tr>
            <tr>
                <th>Sektor</th>
                <td th:class="ds-label" th:text="${rp.publicSector ? 'offentlig' : 'privat'}"></td>
            </tr>
            <tr>
                <th>Opprettet</th>
                <td th:class="ds-label" th:text="${#dates.format(rp.createdMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
            </tr>
            <tr>
                <th>Sidst oppdatert</th>
                <td th:class="ds-label" th:text="${#dates.format(rp.lastUpdatedMs, 'dd-MM-yyyy HH:mm:ss')}"></td>
            </tr>
            <tr>
                <th>Aktiv</th>
                <td th:class="ds-label" th:text="${rp.active ? 'ja' : 'nej'}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3>Informasjoner brukerstadet har rettighet til</h3>
    <div th:unless="${ #lists.isEmpty(rp.relyingPartyEntitlements)}">
        <div class="fixed-headers-table" style="height: 20vh;">
            <table th:class="ds-table" data-zebra="true" data-hover="true">
                <thead>
                <tr><th>Rettighet</th></tr>
                </thead>
                <tbody>
                <tr th:each="ent : ${rp.relyingPartyEntitlements}">
                    <td th:class="ds-label" th:text="${ent.entitlement}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h3>EAA'ere</h3>
    <div th:unless="${ #lists.isEmpty(rp.relyingPartyEaas)}">
        <div class="fixed-headers-table" style="height: 20vh;">
            <table th:class="ds-table" data-zebra="true" data-hover="true">
                <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Intent</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="eaa : ${rp.relyingPartyEaas}">
                    <td th:class="ds-label" th:text="${eaa.namespace}"></td>
                    <td th:class="ds-label" th:text="${eaa.intent}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


</body>
</html>
