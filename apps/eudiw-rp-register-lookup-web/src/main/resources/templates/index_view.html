<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Innsynstenesta</title>
</head>

<body data-color-scheme="light" data-size="md">
    <header th:replace="~{fragments/general :: page_header_fragment}"></header>

    <main id="hovudinnhald" tabindex="-1">
        <div style="display:flex; flex-direction:column; gap:var(--ds-size-2); max-width:720px;">
            <h1 class="ds-heading" data-size="xl">
                Innsynsteneste: Nasjonal sandkasse for digital lommebok
            </h1>
            <p class="ds-paragraph" data-size="lg" style="color:var(--ds-color-neutral-text-subtle);">Søk i registeret over brukarstader, eller utforsk beviskatalogen i sandkassa.</p>
        </div>

        <nav class="flex-container" aria-label="Hovudvalg">
            <a th:href="@{/relying-parties}"
               class="ds-card"
               data-color="accent"
               data-variant="default">
                <h2 class="ds-heading" data-size="sm">Brukarstader</h2>
                <p class="ds-paragraph" data-size="sm">Søk etter brukarstader i sandkassa</p>
            </a>
            <a th:href="@{/credentials-catalogue}"
               class="ds-card"
               data-color="accent"
               data-variant="default">
                <h2 class="ds-heading" data-size="sm">Beviskatalog</h2>
                <p class="ds-paragraph" data-size="sm">Få ein oversikt over gyldige bevistypar i sandkassa</p>
            </a>
        </nav>

    </main>
    <footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
