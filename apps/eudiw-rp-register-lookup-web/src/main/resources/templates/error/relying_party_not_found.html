<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no">
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title>Brukarstad finst ikkje</title>
</head>

<body data-color-scheme="light" data-size="md">
    <header th:replace="~{fragments/general :: page_header_fragment}"></header>

    <main id="hovudinnhald" tabindex="-1">
        <div class="ds-alert" data-color="warning" role="alert">
            <h1 class="ds-heading" data-size="md">
                Brukarstad finst ikkje
            </h1>
            <p class="ds-paragraph">
                Brukarstad ikkje funne for ID/organisasjonsnummer:
                <strong th:text="${requestedIdOrOrgnoAttr}"></strong>.
            </p>
            <p class="ds-paragraph">
                Sjekk om rett verdi og prøv på ny eller rapporter bug i Jira om du
                trur noko er gale.
            </p>
        </div>

        <div>
            <a th:href="@{/relying-parties}" class="ds-button">
                Tilbake til søk
            </a>
        </div>
    </main>

    <footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
