<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nb-no"
      th:with="credential=${credentialAttr}">
<!--/*@thymesVar id="credentialAttr" type="no.idporten.eudiw.rp.register.lookup.web.resource.credentials.CredentialResource"*/-->
<head>
    <th:block th:replace="~{fragments/general :: base_head_fragment}"></th:block>
    <title th:text="|Detaljar for ${credential.getCredentialType()}|"></title>
</head>
<body data-color-scheme="light" data-size="md">
    <header th:replace="~{fragments/general :: page_header_fragment}"></header>

    <main id="hovudinnhald" tabindex="-1">
        <nav aria-label="Brødsmulesti" class="ds-breadcrumbs">
            <ol>
                <li><a th:href="@{/}" class="ds-link">Heim</a></li>
                <li><a th:href="@{/credentials-catalogue}" class="ds-link">Beviskatalog</a></li>
                <li><a href="#" class="ds-link" aria-current="page" th:text="${credential.getCredentialTypeDisplayName('no')}">Bevis</a></li>
            </ol>
        </nav>

        <div>
            <a th:href="@{/credentials-catalogue}" class="ds-button" data-variant="secondary">
                Tilbake til beviskatalog
            </a>
        </div>

        <div style="display:flex; flex-direction:column; gap:var(--ds-size-2); max-width:720px;">
            <h1 class="ds-heading" data-size="xl">
                Detaljar for bevis: <span th:text="${credential.getCredentialTypeDisplayName('no')}"/>
            </h1>
            <p class="ds-paragraph" data-size="lg" style="color:var(--ds-color-neutral-text-subtle);">Metadetaljar, utstedar og attributt for vald bevistype.</p>
        </div>

        <div
             th:replace="~{fragments/credentials_fragments
                            :: single_credential_table_fragment(credential=${credential})}">
        </div>
    </main>

    <footer th:replace="~{fragments/general :: page_footer_fragment}"></footer>
</body>
</html>
