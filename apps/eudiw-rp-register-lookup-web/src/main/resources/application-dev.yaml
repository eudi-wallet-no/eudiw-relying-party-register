---
server:
  port: 9210

management:
  server:
    port: 9211
  endpoint:
    health:
      show-details: always

eudiw-rp-register-lookup-web:
  service:
    rest-client-defaults:
      register-service-api-base-uri: ${API_BASE_URI}

spring:
  application:
    environment: dev
  config:
    import: file:.env[.properties]

external-dependency-health-checks:
  enabled: false
