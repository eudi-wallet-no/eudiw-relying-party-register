---
server:
  port: 9210

management:
  server:
    port: 9211
  endpoint:
    health:
      show-details: always

spring:
  config:
    import: optional:file:${EUDIW_RP_REGISTER_LOOKUP_WEB_ENV}[.properties]
  application:
    environment: docker

eudiw-rp-register-lookup-web:
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://rp-register-service:9200
  credentials-service:
    credentials-registry-api:
      credentials-registry-base-uri: http://credential-registry:9294



external-dependency-health-checks:
  enabled: false
