TEST_MOCK_WEB_SERVER_PORT: 9217

eudiw-rp-register-lookup-web:
  relying-parties-service:
    register-service-api:
      register-service-base-uri: http://localhost:${TEST_MOCK_WEB_SERVER_PORT}/
      api-key-value: xxx
  credentials-service:
    credentials-registry-api:
      credentials-registry-base-uri: http://localhost:${TEST_MOCK_WEB_SERVER_PORT}/
  security:
    enabled: true
    csp:
      mode: enforce
      policy: >-
        #report-uri http://localhost:8080/api/reports;
        default-src 'none';
        script-src 'self';
        script-src-attr 'none';
        style-src 'self';
        style-src-attr 'none';
        style-src-elem 'self' https://altinncdn.no/fonts/inter/v4.1/inter.css;
        img-src 'self' data:;
        font-src 'self' https://altinncdn.no/fonts/inter/v4.1/;
        connect-src 'self';
        form-action 'self';
        base-uri 'none';
        object-src 'none';
        frame-ancestors 'none'