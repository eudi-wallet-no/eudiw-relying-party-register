name: digital-lommebok-rp
networks:
  digital-lommebok:
    name: digital-lommebok

services:
  rp-register-db:
    extends:
      file: ../eudiw-rp-register-service/docker-compose.yaml
      service: rp-register-db

  rp-register-service:
    extends:
      file: ../eudiw-rp-register-service/docker-compose.yaml
      service: rp-register-service

  ca-db:
    extends:
      file: ../eudiw-ca-service/docker-compose.yaml
      service: ca-db

  ca-service:
    extends:
      file: ../eudiw-ca-service/docker-compose.yaml
      service: ca-service

  credential-registry:
    build:
      context: ../..
      dockerfile: apps/eudiw-credential-registry/docker/dev.Dockerfile
      args:
        GIT_PACKAGE_TOKEN: ${GIT_PACKAGE_TOKEN}
        GIT_PACKAGE_USERNAME: ${GIT_PACKAGE_USERNAME}
    environment:
      spring_profiles_active: docker
      _JAVA_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0 -Dotel.metrics.exporter=none -Dotel.traces.exporter=none -Dotel.span.exporter=none -Dotel.logs.exporter=none"
    env_file:
      - ${EUDIW_CREDENTIAL_REGISTRY_ENV}
    ports:
      - "9294:9294"
      - "9295:9295"
    networks:
      - digital-lommebok
    depends_on:
      rp-register-service:
        condition: service_healthy
    entrypoint: "/bin/bash -c"
    command:
      - |
        cd /usr/local/webapps/
        java -javaagent:opentelemetry-javaagent.jar -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9295 -jar application.jar
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9294/health/readiness || exit 1
      interval: 15s
      start_period: 5s
      timeout: 5s
      retries: 20
