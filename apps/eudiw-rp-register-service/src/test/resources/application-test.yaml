management:
  server:
    port:

spring:
  security:
    api-key: junit-api-key
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    url: "jdbc:h2:mem:rp_junit;MODE=MySQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: junit
    password: junit
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

TEST_MOCK_CA_SERVER_PORT: 9207
eudiw-rp-register-service:
  csr-service:
    ca-service-api:
      ca-service-base-uri: http://localhost:${TEST_MOCK_CA_SERVER_PORT}
      api-key-value: xxx
