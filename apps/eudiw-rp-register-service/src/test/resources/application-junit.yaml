management:
  server:
    port:

spring:
  security:
    api-key: junit-api-key
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    # Keep the database alive between connections and cached Spring contexts.
    url: "jdbc:tc:mariadb:11.4:///rp_junit?TC_DAEMON=true"
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: junit
    password: junit

TEST_MOCK_CA_SERVER_PORT: 9207
eudiw-rp-register-service:
  wrp:
    issuer: https://registry.example.test
    registry-uri: https://registry.example.test/wrp
    jwks-url: https://registry.example.test/wrp/jwks
    signing-keystore: wrp-test
    signing-key-id: wrp-test-key
  csr-service:
    access-certificate-ca-id: junitaccess1
    ca-service-api:
      ca-service-base-uri: http://localhost:${TEST_MOCK_CA_SERVER_PORT}
      api-key-value: xxx

idporten-key-manager:
  default-keystore: wrp-test
  keystores:
    wrp-test:
      key-store-location: classpath:/wrp-test.p12
      key-store-type: PKCS12
      key-store-password: junit
      key-alias: wrp-test
      key-password: junit
