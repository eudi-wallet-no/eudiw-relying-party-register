management:
  server:
    port:

spring:
  security:
    api-key: junit-api-key
  datasource:
    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    # Keep the database alive between connections and cached Spring contexts.
    url: "jdbc:tc:mariadb:11.4:///rp_junit?TC_DAEMON=true"
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: junit
    password: junit

TEST_MOCK_CA_SERVER_PORT: 9207
eudiw-rp-register-service:
  csr-service:
    access-certificate-ca-id: junitaccess1
    ca-service-api:
      ca-service-base-uri: http://localhost:${TEST_MOCK_CA_SERVER_PORT}
      api-key-value: xxx
