---
server:
  port: 9200
management:
  server:
    port: 9201
  endpoint:
    health:
      show-details: always
spring:
  config:
    import: optional:file:${EUDIW_RP_REGISTER_SERVICE_ENV}[.properties]
  datasource:
    url: "jdbc:mariadb://localhost:36306/rp_register_db"
    username: eudiw_user
    password: lesssecret
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
  application:
    environment: dev

eudiw-rp-register-service:
  registry-uri: ${REGISTRY_URI:http://localhost:9200/wrp}
  csr-service:
    ca-service-api:
      ca-service-base-uri: http://localhost:9220
  wrp:
    issuer: ${WRP_ISSUER:http://localhost:9200}
    registry-uri: ${WRP_REGISTRY_URI:http://localhost:9200/wrp}
    jwks-url: ${WRP_JWKS_URL:http://localhost:9200/wrp/jwks}
    signing-key-id: ${WRP_SIGNING_KEY_ID:wrp-signing-dev}

external-dependency-health-checks:
  enabled: false