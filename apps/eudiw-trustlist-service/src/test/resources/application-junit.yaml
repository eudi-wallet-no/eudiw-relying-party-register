---
spring:
  application:
    environment: junit

trustlist-service:
  tsl612:
    service-providers:
      digdir:
        services:
          - name:
              lang-no: CA for relying parties access certificates in eidas2sandkasse
              lang-en: CA for relying parties access certificates in eidas2sandkasse
            starting-time: 2025-07-03T12:00:00.00Z
            service-type-identifier: http://uri.etsi.org/Svc/Svctype/CA/RPaccess
            cert: 
      my-junit-provider:
        name:
          lang-no: Enhetstest provider
          lang-en: My Junit provider
        trade-name:
          lang-no: NTRNO-991825827
          lang-en: NTRNO-991825827
        information-uris:
          lang-no: https://example.com/my-junit-provider
          lang-en: https://example.com/my-junit-provider
        email: mailto:example@example.com
        website: https://www.junitest.no
        postal-address:
          street-address: Askedalen 1
          postal-code: 6850
          locality: Leikanger
          country: "NO"
        services:
          - name:
              lang-no: Enhetstest 1 CA i eidas2sandkasse
              lang-en: Junit 1 CA in eidas2sandkasse
            starting-time: 2026-03-26T00:00:00.00Z
            service-type-identifier: http://uri.etsi.org/Svc/Svctype/CA/RPaccess
            cert: 
          - name:
              lang-no: Enhetstest 2 CA i eidas2sandkasse
              lang-en: Junit 2 CA in eidas2sandkasse
            starting-time: 2026-03-27T00:00:00.00Z
            service-type-identifier: http://uri.etsi.org/Svc/Svctype/CA/RPaccess
            cert: 
  tsl602:
    tsl-aca:
      keystore: signing-602
      trusted-entities:
        digdir:
          trusted-entity-services:
            - service-information:
                service-type-identifier:
                  a: http://uri.etsi.org/19602/SvcType/WRPAC/Issuance
                service-name:
                  lang-no: ca 1 fra Digdir
                  lang-en: ca 1 from Digdir
                service-digital-identity:
                  certs:
                    - cert1
            - service-information:
                service-name:
                  lang-no: ca 2 fra Digdir
                  lang-en: ca 2 from Digdir
                service-digital-identity:
                  certs:
                    - cert2

    tsl-pid:
      keystore: signing-602-pid
      trusted-entities:
        digdir:
          trusted-entity-services:
            - service-information:
                service-type-identifier:
                  a: http://uri.etsi.org/19602/SvcType/PID/Issuance
                service-name:
                  lang-no: Fyrste PID-utsteder fra Digdir
                  lang-en: First PID-issuer from Digdir
                service-digital-identity:
                  certs:
                    - cert1
            - service-information:
                service-type-identifier:
                  a: http://uri.etsi.org/19602/SvcType/PID/Issuance
                service-name:
                  lang-no: Nok ein PID-utsteder fra Digdir
                  lang-en: Nok PID-issuer from Digdir
                service-digital-identity:
                  certs:
                    - cert2
                    - cert3
                    - cert4

    tsl-wallet:
      keystore: signing-602-wallet

idporten-key-manager:
  keystores:
    signing-612:
      key-store-location: base64:
      key-store-type: pkcs12
      key-store-password: changeit
      key-alias: junit_trustlist-signing
      key-password: changeit
    signing-602:
      key-store-location: base64:
      key-store-type: pkcs12
      key-store-password: changeit
      key-alias: eidas2sandkasse-trustlist-dev-local
      key-password: changeit
    signing-602-pid:
      key-store-location: base64:
      key-store-type: pkcs12
      key-store-password: changeit
      key-alias: eidas2sandkasse-trustlist-dev-local
      key-password: changeit
    signing-602-wallet:
      key-store-location: base64:
      key-store-type: pkcs12
      key-store-password: changeit
      key-alias: eidas2sandkasse-trustlist-dev-local
      key-password: changeit
