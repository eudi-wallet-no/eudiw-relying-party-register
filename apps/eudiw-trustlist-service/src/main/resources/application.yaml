---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: eudiw-trust-list-service
    environment: default

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
