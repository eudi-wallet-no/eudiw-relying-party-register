---
server:
  port: 8080

spring:
  thread-executor: virtual
  application:
    name: digital-lommebok-trust-list-service
    environment: default

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: info,version,prometheus,health
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.application.environment}

trust-service:
  scheme-information:
    sequence-number: 1
    list-issue-datetime: 2025-06-25T10:00:00.1Z
  keystore:
    type: ${TSL_SIGN_KEYSTORE_TYPE}
    location: ${TSL_SIGN_KEYSTORE}
    password: ${TSL_SIGN_KEYSTORE_KEY_PASSWORD}
    key-alias: ${TSL_SIGN_KEYSTORE_KEY_ALIAS}
    key-password: ${TSL_SIGN_KEYSTORE_KEY_PASSWORD}
