version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

updates:
  # ==============
  # MAVEN (Spring Boot-apper)
  # ==============
  # "directories: /apps/*" plukker opp alle apper med en pom.xml direkte under apps/.
  # "group-by: dependency-name" gir én PR per avhengighet som trenger oppdatering, og
  # samler den på tvers av alle apper der den brukes (f.eks. én "Bump spring-boot"-PR
  # selv om både admin og service må oppdateres). Ulike avhengigheter (f.eks. Spring
  # Boot og Jackson) havner fortsatt i separate PR-er — vi unngår dermed både
  # "én PR per app per avhengighet" og "én kjempe-PR med 10 urelaterte bumps".
  - package-ecosystem: "maven"
    directories:
      - "/apps/*"
    registries:
      - maven-github
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      alle-maven-oppdateringer:
        group-by: dependency-name

  # ==============
  # DOCKER
  # ==============
  # Samme prinsipp som Maven: "group-by: dependency-name" gir én PR per image/tag som
  # trenger oppdatering, samlet på tvers av apper — ikke separate PR-er per app-mappe.
  - package-ecosystem: "docker"
    directories:
      - "/apps/*/docker"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      alle-docker-oppdateringer:
        group-by: dependency-name

  # ==============
  # GITHUB ACTIONS
  # ==============
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      alle-actions-oppdateringer:
        patterns:
          - "*"
