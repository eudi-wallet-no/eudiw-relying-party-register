version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

updates:
  # ==============
  # MAVEN (Spring Boot-apper)
  # ==============
  # "directories: /apps/*" plukker opp alle apper med en pom.xml direkte under apps/.
  # Gruppering etter semver-nivå + "group-by: dependency-name":
  #   - patch/minor: samles bredt i én PR per nivå, på tvers av alle apper som bruker
  #     avhengigheten (lav risiko, trenger ikke individuell review per app).
  #   - major: matcher ingen gruppe under, så Dependabot faller tilbake til standard
  #     oppførsel — én individuell PR per avhengighet per app. Gir mest isolasjon og
  #     grundigst review nettopp der risikoen for brudd er størst.
  - package-ecosystem: "maven"
    directories:
      - "/apps/*"
    registries:
      - maven-github
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      patch-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
        group-by: dependency-name
      minor-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
        group-by: dependency-name

  # ==============
  # DOCKER
  # ==============
  # Samme prinsipp som Maven: patch/minor grupperes bredt på tvers av apper, mens
  # major-bumps forblir individuelle PR-er per app for tettere review.
  - package-ecosystem: "docker"
    directories:
      - "/apps/*/docker"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      patch-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
        group-by: dependency-name
      minor-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
        group-by: dependency-name

  # ==============
  # GITHUB ACTIONS
  # ==============
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      alle-actions-oppdateringer:
        patterns:
          - "*"
