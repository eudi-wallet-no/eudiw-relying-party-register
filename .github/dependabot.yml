# Dependabot-oppsett: én PR per app.
#
# Regler:
# - Én Maven-oppføring per app med eksplisitt `directory:` (IKKE `directories`-wildcard)
#   for å støtte @dependabot rebase/recreate.
# - `alle-oppdateringer`-gruppen samler alle oppgraderinger per app; `security`-gruppen
#   (applies-to: security-updates) skiller sikkerhetsoppdateringer.
# - `exclude-patterns` for org.springframework.boot:spring-boot-starter-parent: den drar med
#   seg hele avhengighetstreet og kolliderer med CVE-pinninger, så den skal ha egen PR.
# - Ikke gjeninnfør group-by: dependency-name (kan ikke rebases, dependabot-core#14780).
# - YAML-anchors støttes IKKE av Dependabot, så oppsettet gjentas per app.
# - Docker-oppføringer er utelatt (base-images hentes dynamisk).

version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

updates:
  # ============================================================
  # eudiw-ca-service
  # ============================================================
  - package-ecosystem: maven
    directory: /apps/eudiw-ca-service
    registries:
      - maven-github
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - eudiw-ca-service
    groups:
      alle-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:spring-boot-starter-parent"
      security:
        applies-to: security-updates
        patterns:
          - "*"

