version: 2

registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/felleslosninger
    username: ${{secrets.GH_PACKAGES_READ_USER}}
    password: ${{secrets.GH_PACKAGES_READ_PAT}}

updates:
  - package-ecosystem: "maven"
    directories:
      - "/apps/*"
    registries:
      - maven-github
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    groups:
      patch-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "docker"
    directories:
      - "/apps/*/docker"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      patch-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-oppdateringer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      alle-actions-oppdateringer:
        patterns:
          - "*"
